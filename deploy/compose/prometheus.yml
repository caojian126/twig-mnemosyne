# Prometheus 抓取与告警配置（monitoring profile）。
# 全部走 compose 内网直抓——公网的 /metrics 已被 Caddy 403（2026-09-28 收口）。
# mcp-gateway 的 /metrics 目前是 JSON 包裹（{ok, metrics}）不适合直抓；其调用指标
# 经 runtime 的 forge BFF（/v1/web/mcp/health）观测，改纯文本端点后可加 job。
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mnemosyne-runtime
    metrics_path: /metrics
    static_configs:
      - targets: ['mnemosyne:8000']
  # litellm 自身暴露 prometheus 指标（需 litellm_settings.success_callback 启用后才有数据）
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ['litellm:4000']
