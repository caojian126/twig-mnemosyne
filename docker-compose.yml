# docker-compose.yml — §13.3（VULN-08 修复段 + v0.3.0 增补）
# profiles: vector-kg/monitoring/local-lane 默认不启；个人生产 2C4G 形态 = 默认服务集
# 全栈 healthcheck + depends_on 条件启动（2026-09-28）：mnemosyne 不再在 postgres 未就绪时抢跑
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Runtime Core ───
  mnemosyne:
    build: ./runtime
    # 只绑回环：runtime 端口上有 /internal/broker/token、/v1/admin/*（仅静态 token 一道门），
    # 公网入口一律走 caddy 反代；上 Vultr 等裸 compose 部署时全接口发布会是公网洞
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://mnemosyne:${DB_PASSWORD}@postgres:5432/mnemosyne
      - REDIS_URL=redis://redis:6379
      # QDRANT_URL 预留（vector-kg profile）：runtime 侧尚无消费者，接通前不注入
      - TWIG_URL=http://twig-memory:7300
      - MUNINN_AUTH_TOKEN=${MUNINN_AUTH_TOKEN}
      - LITELLM_URL=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      - MCP_GATEWAY_URL=http://mcp-gateway:3000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - WEBHOOK_HOST_ALLOWLIST=${WEBHOOK_HOST_ALLOWLIST:-mnemosyne.zeabur.internal}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - BROKER_INTERNAL_TOKEN=${BROKER_INTERNAL_TOKEN}
      - CONFIRM_SECRET=${CONFIRM_SECRET}
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-}
      - ALLOW_INSECURE_WEBHOOK=${ALLOW_INSECURE_WEBHOOK:-0}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - PRIVACY_LOCAL_THRESHOLD=${PRIVACY_LOCAL_THRESHOLD:-70}
      - CRISIS_SILENCE_HOURS=${CRISIS_SILENCE_HOURS:-24}
      - MAX_MESSAGE_TOKENS=${MAX_MESSAGE_TOKENS:-4096}
      # 反刍排程（技术文档「每日 cron」）：近 24h 活跃用户逐个 reflect；0 关闭
      - REFLECT_ENABLED=${REFLECT_ENABLED:-1}
      # 服务器时区（容器为 UTC）：30 18 * * * ≈ 北京时间 02:30
      - REFLECT_CRON=${REFLECT_CRON:-30 18 * * *}
      - REFLECT_ACTIVE_HOURS=${REFLECT_ACTIVE_HOURS:-24}
      - REFLECT_TIMEOUT_MS=${REFLECT_TIMEOUT_MS:-900000}
      # TTS Provider 配置（§21.3：云端优先链 elevenlabs→siliconflow→openai）
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - TTS_SILICONFLOW_VOICE=${TTS_SILICONFLOW_VOICE:-}
      - TTS_OPENAI_VOICE=${TTS_OPENAI_VOICE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # v0.3.0 新增：本地模型边车（形态 A 时指向 tailnet）
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://ollama:11434}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      twig-memory:
        condition: service_healthy
      litellm:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./skills:/app/skills:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne

  # ─── Model Gateway ───
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - DATABASE_URL=postgresql://litellm:${DB_PASSWORD}@postgres:5432/litellm
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      # 中转/聚合渠道（litellm.yaml 里 os.environ 解析；漏传则对应模型全线 401）
      - COMMANDCODE_API_KEY=${COMMANDCODE_API_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      # 形态 A 指向 tailnet IP；形态 B 指向 ollama 服务名
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://ollama:11434}
    volumes:
      - ./deploy/compose/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne

  # ─── MCP Gateway（本仓库自有实现；server 清单在 mcp-gateway/config.default.json，烤入镜像）───
  mcp-gateway:
    build:
      context: .
      dockerfile: mcp-gateway/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./skills:/app/skills:ro
      - gateway_data:/app/data
    environment:
      - BROKER_URL=http://mnemosyne:8000
      - BROKER_INTERNAL_TOKEN=${BROKER_INTERNAL_TOKEN}
      - MCP_STATE_PATH=/app/data/dynamic-servers.json
      # env 预注册清单（[{name,url,headers?,skill_document?}]；Bearer 只走 env 不入 git）
      - MCP_BOOT_REGISTRATIONS=${MCP_BOOT_REGISTRATIONS:-}
      # builtin 学术工具的凭证/礼貌头（缺省走无 key 兜底池）
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - OPENALEX_EMAIL=${OPENALEX_EMAIL:-}
      - DEFAULT_TIMEZONE=${DEFAULT_TIMEZONE:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne

  # ─── Narrative Engine (twig-memory) ───
  twig-memory:
    build: ./twig-memory
    ports:
      - "127.0.0.1:7300:7300"
    environment:
      - KIMI_API_KEY=${KIMI_API_KEY}
      - MUNINN_AUTH_TOKEN=${MUNINN_AUTH_TOKEN}
      - MUNINN_DATA_DIR=/data
      - MUNINN_TZ=${MUNINN_TZ:-Asia/Shanghai}
    volumes:
      - twig_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7300/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne

  # ─── Database ───
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mnemosyne
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mnemosyne
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/compose/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
      - ./deploy/compose/init-litellm.sh:/docker-entrypoint-initdb.d/20-litellm.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemosyne -d mnemosyne"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne

  # ─── Cache ───
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne

  # ─── Vector DB (optional) ───
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne
    profiles: ["vector-kg"]

  # ─── Observability (optional) ───
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/compose/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      # provisioning：datasource（prometheus）+ dashboards provider + 面板 JSON，起容器即用
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne
    profiles: ["monitoring"]

  # ─── Local Model Sidecar（形态 B，默认不启）───
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne
    profiles: ["local-lane"]

  # ─── Reverse Proxy（主域同时托管爱琴海之夜 Dashboard 静态站 + API 反代）───
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default-logging
    networks:
      - mnemosyne

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  twig_data:
  gateway_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  ollama_data:

networks:
  mnemosyne:
    driver: bridge
