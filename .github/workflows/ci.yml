name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    name: runtime typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mcp-gateway:
    name: mcp-gateway typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    name: web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm run build

  litellm-parity:
    name: litellm 双配置一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-litellm-parity.mjs

  compose-config:
    name: compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 docker-compose 语法（需要 .env 占位变量）
        run: |
          cp .env.example .env
          docker compose config -q
